name: RDC CI

on:
  pull_request:
    branches: [ 'develop', 'dgalants/ci', 'amd-staging', 'amd-mainline' ]
    paths:
      - 'projects/rdc/**'
      - '.github/workflows/rdc-ci.yml'
  workflow_dispatch:

env:
  DEBIAN_FRONTEND: noninteractive
  DEBCONF_NONINTERACTIVE_SEEN: true
  BUILD_TYPE: RelWithDebInfo
  ROCM_DIR: /opt/rocm

defaults:
  run:
    working-directory: projects/rdc

jobs:
  build:
    runs-on:
      - self-hosted
      - ${{ vars.RUNNER_TYPE }}
    container: rocm/dev-ubuntu-22.04:6.3
    outputs:
      TODAY: ${{ steps.metadata.outputs.TODAY }}

    steps:
    - uses: actions/checkout@v4

    - name: Build metadata
      id: metadata
      working-directory: .
      run: |
        TODAY="$(date +%Y_%m_%d)"
        echo "TODAY=$TODAY" >> "$GITHUB_ENV"
        echo "TODAY=$TODAY" >> "$GITHUB_OUTPUT"

    - name: Install build tools
      working-directory: .
      run: |
        apt update -y
        apt install -y \
          build-essential \
          ccache \
          cmake \
          curl \
          git \
          gzip \
          jq \
          libcap-dev \
          tar \
          unzip \
          wget \
          zip \
          zstd

    - name: Cache .ccache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ccache
        key: ${{ runner.os }}-rdc-ccache-${{ github.ref_name }}-${{ env.TODAY }}
        restore-keys: |
          ${{ runner.os }}-rdc-ccache-${{ github.ref_name }}-
          ${{ runner.os }}-rdc-ccache-

    - name: Build RDC
      run: |
        pwd
        cmake \
            -B build \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
            -DGRPC_DESIRED_VERSION=1.61.0 \
            -DGRPC_ROOT=/usr/grpc \
            -DBUILD_RUNTIME=ON \
            -DGPU_TARGETS=gfx942 \
            -DBUILD_PROFILER=ON \
            -DBUILD_RVS=OFF \
            -DBUILD_TESTS=ON \
            -DCPACK_GENERATOR="DEB" \
            -DCMAKE_INSTALL_PREFIX=${ROCM_DIR}
        make -C build -j $(nproc)
        make -C build -j $(nproc) package

    - name: Install RDC
      run: |
        echo "pre: "
        ls -lah /opt
        make -C build -j $(nproc) install
        echo "post: "
        ls -lah /opt

    - name: Package RDC
      uses: actions/upload-artifact@v4
      with:
        name: rdc
        path: projects/rdc/build/rdc*.deb
        if-no-files-found: error
        retention-days: 5

  # =================================================================
  #  Test job — non-GPU tests (installation, CLI, Python, parsers)
  # =================================================================
  test:
    needs: build
    runs-on:
      - self-hosted
      - ${{ vars.RUNNER_TYPE }}
    container: rocm/dev-ubuntu-22.04:6.3

    steps:
    - uses: actions/checkout@v4

    - name: Install test dependencies
      working-directory: .
      run: |
        apt update -y
        apt install -y python3 python3-pip
        pip3 install pytest

    - name: Download RDC package
      uses: actions/download-artifact@v4
      with:
        name: rdc
        path: /opt/

    - name: Install RDC package
      shell: bash
      working-directory: .
      run: |
        COUNT=$(find /opt/ -iname 'rdc*.deb' | wc -l)
        test "$COUNT" -eq '2'
        dpkg --force-all -i /opt/rdc*.deb

    - name: Verify RDC installation
      shell: bash
      working-directory: .
      run: |
        # confirm binaries are installed
        find $ROCM_DIR/bin -maxdepth 1 -iname rdcd
        find $ROCM_DIR/bin -maxdepth 1 -iname rdci
        find $ROCM_DIR/share/rdc -iname rdctst
        # confirm that libraries are installed
        MISSING_LIBS=()
        for lib in librdc.so librdc_bootstrap.so librdc_client.so; do
          test -e "$ROCM_DIR/lib/$lib" || MISSING_LIBS+=("$lib")
        done
        for lib in librdc_rocr.so librdc_rocp.so; do
          test -e "$ROCM_DIR/lib/rdc/$lib" || MISSING_LIBS+=("$lib")
        done
        if test "${#MISSING_LIBS[@]}" != "0"; then
          echo "Missing libs found!"
          for lib in "${MISSING_LIBS[@]}"; do
            echo "- $lib"
          done
          exit 1
        else
          echo "No missing libs found!"
        fi

    # ---------------------------------------------------------------
    # RDC CI Test Suite
    # Mapped to test plan sections:
    #   4.1 Core/CLI       - test_rdc_core.py
    #   4.2 Python API     - test_python_api.py
    #   4.3 Integration    - test_integration.py
    #   4.4 Negative/Error - test_negative_resilience.py
    #   4.5 Performance    - test_performance.py  (GPU-only)
    #   4.6 Unit/Parser    - test_unit_parser.py
    #   GTest runner       - test_gtest_runner.py
    # ---------------------------------------------------------------

    - name: "Test 4.1: RDC Core / CLI (no GPU)"
      shell: bash
      run: |
        python3 -m pytest tests/ci/test_rdc_core.py \
          -k "TestInstallation or TestCLIUsage or TestNegativeCLI" \
          -v --tb=short \
          --junitxml=build/test-results-core-nogpu.xml
      env:
        RDC_SRC_DIR: ${{ github.workspace }}/projects/rdc/python_binding

    - name: "Test 4.2: Python API / Bindings"
      shell: bash
      run: |
        python3 -m pytest tests/ci/test_python_api.py \
          -v --tb=short \
          --junitxml=build/test-results-python-api.xml
      env:
        RDC_SRC_DIR: ${{ github.workspace }}/projects/rdc/python_binding

    - name: "Test 4.3: Integration (Prometheus, Grafana, RAS)"
      shell: bash
      run: |
        python3 -m pytest tests/ci/test_integration.py \
          -v --tb=short \
          --junitxml=build/test-results-integration.xml
      env:
        RDC_SRC_DIR: ${{ github.workspace }}/projects/rdc/python_binding

    - name: "Test 4.4: Negative / Error Handling (no GPU)"
      shell: bash
      run: |
        python3 -m pytest tests/ci/test_negative_resilience.py \
          -k "TestAuthErrors or TestClientBeforeDaemon" \
          -v --tb=short \
          --junitxml=build/test-results-negative-nogpu.xml
      env:
        RDC_SRC_DIR: ${{ github.workspace }}/projects/rdc/python_binding

    - name: "Test 4.6: Unit / Parser Tests"
      shell: bash
      run: |
        python3 -m pytest tests/ci/test_unit_parser.py \
          -v --tb=short \
          --junitxml=build/test-results-unit-parser.xml
      env:
        RDC_SRC_DIR: ${{ github.workspace }}/projects/rdc/python_binding

    - name: "Test GTest: rdctst --gtest_list_tests"
      shell: bash
      run: |
        python3 -m pytest tests/ci/test_gtest_runner.py \
          -k "test_rdctst_list_tests" \
          -v --tb=short \
          --junitxml=build/test-results-gtest-list.xml

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: rdc-test-results
        path: projects/rdc/build/test-results-*.xml
        retention-days: 30

  # =================================================================
  #  GPU test job — requires AMD GPU hardware
  #  Enable by setting repo variable: RDC_GPU_TESTS_ENABLED=true
  # =================================================================
  test-gpu:
    needs: build
    runs-on:
      - self-hosted
      - ${{ vars.RUNNER_TYPE }}
    if: ${{ vars.RDC_GPU_TESTS_ENABLED == 'true' }}
    container:
      image: rocm/dev-ubuntu-22.04:6.3
      options: --device=/dev/kfd --device=/dev/dri --group-add video

    steps:
    - uses: actions/checkout@v4

    - name: Set up environment
      working-directory: .
      run: |
        apt update -y
        apt install -y python3 python3-pip
        pip3 install pytest

    - name: Download RDC package
      uses: actions/download-artifact@v4
      with:
        name: rdc
        path: /opt/

    - name: Install RDC package
      shell: bash
      working-directory: .
      run: |
        dpkg --force-all -i /opt/rdc*.deb

    - name: "Test 4.1: RDC Core / CLI (with GPU + daemon)"
      shell: bash
      run: |
        python3 -m pytest tests/ci/test_rdc_core.py \
          -v --tb=short \
          --junitxml=build/test-results-core-gpu.xml
      env:
        RDC_SRC_DIR: ${{ github.workspace }}/projects/rdc/python_binding

    - name: "Test 4.4: Negative / Resilience (with GPU)"
      shell: bash
      run: |
        python3 -m pytest tests/ci/test_negative_resilience.py \
          -v --tb=short \
          --junitxml=build/test-results-negative-gpu.xml
      env:
        RDC_SRC_DIR: ${{ github.workspace }}/projects/rdc/python_binding

    - name: "Test 4.5: Performance / Scalability (with GPU)"
      shell: bash
      run: |
        python3 -m pytest tests/ci/test_performance.py \
          -v --tb=short \
          --junitxml=build/test-results-performance.xml
      env:
        RDC_SRC_DIR: ${{ github.workspace }}/projects/rdc/python_binding

    - name: "Test GTest: rdctst embedded batch (with GPU)"
      shell: bash
      run: |
        python3 -m pytest tests/ci/test_gtest_runner.py \
          -k "test_rdctst_embedded_batch" \
          -v --tb=short \
          --junitxml=build/test-results-gtest-batch.xml

    - name: Upload GPU test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: rdc-test-results-gpu
        path: projects/rdc/build/test-results-*.xml
        retention-days: 30
